<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUNA Shopping Sync</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <h1>LUNA Shopping Sync</h1>

  <p id="status">Pronto para testar a ligação.</p>

  <button onclick="connectGoogle()">Ligar ao Google</button>
  <button onclick="readShopping()">Ler Google Sheet</button>

  <hr>

  <h2>Adicionar produto</h2>

  <input
    id="product"
    type="text"
    placeholder="Produto"
  >

  <input
    id="quantity"
    type="number"
    value="1"
    min="1"
  >

  <input
    id="category"
    type="text"
    placeholder="Categoria"
  >

  <button onclick="addProduct()">Adicionar à lista</button>

  <pre id="output"></pre>


  <script>

    const CLIENT_ID =
      '447933051526-jdcl86ljqb6ehsiupr3aomjhia0fbqr2.apps.googleusercontent.com';

    const SPREADSHEET_ID =
      '1XqsIs_fp_nAOHNP7H5FVWO6usFInSCFXnCDSt6ov9eA';

    const RANGE = 'Sheet1!A:F';

    let accessToken = null;


    // =========================
    // LIGAR AO GOOGLE
    // =========================

    function connectGoogle() {

      const tokenClient =
        google.accounts.oauth2.initTokenClient({

          client_id: CLIENT_ID,

          scope:
            'https://www.googleapis.com/auth/spreadsheets',

          callback: (response) => {

            if (response.error) {

              document.getElementById('status').textContent =
                'Erro de autorização: ' + response.error;

              return;
            }

            accessToken = response.access_token;

            document.getElementById('status').textContent =
              'Google ligado com sucesso.';
          }

        });

      tokenClient.requestAccessToken();
    }


    // =========================
    // LER LISTA
    // =========================

    async function readShopping() {

      if (!accessToken) {

        document.getElementById('status').textContent =
          'Primeiro carrega em "Ligar ao Google".';

        return;
      }

      document.getElementById('status').textContent =
        'A ler a Google Sheet...';

      try {

        const response = await fetch(

          `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(RANGE)}`,

          {
            headers: {
              Authorization: `Bearer ${accessToken}`
            }
          }
        );


        const data = await response.json();


        if (!response.ok) {
          throw new Error(JSON.stringify(data));
        }


        document.getElementById('status').textContent =
          'Google Sheet lida com sucesso.';


        document.getElementById('output').textContent =
          JSON.stringify(data.values || [], null, 2);


      } catch (error) {

        document.getElementById('status').textContent =
          'Erro ao ler a Google Sheet.';

        document.getElementById('output').textContent =
          error.message;
      }
    }


    // =========================
    // ADICIONAR PRODUTO
    // =========================

    async function addProduct() {

      if (!accessToken) {

        document.getElementById('status').textContent =
          'Primeiro carrega em "Ligar ao Google".';

        return;
      }


      const product =
        document.getElementById('product').value.trim();

      const quantity =
        document.getElementById('quantity').value || '1';

      const category =
        document.getElementById('category').value.trim() || 'Outros';


      if (!product) {

        document.getElementById('status').textContent =
          'Escreve primeiro o nome do produto.';

        return;
      }


      document.getElementById('status').textContent =
        'A adicionar ' + product + '...';


      try {

        const id =
          'item-' + Date.now();


        const url =
          `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(RANGE)}:append?valueInputOption=USER_ENTERED`;


        const response = await fetch(url, {

          method: 'POST',

          headers: {

            Authorization:
              `Bearer ${accessToken}`,

            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            values: [
              [
                id,
                product,
                quantity,
                category,
                'pending',
                'LUNA Shopping Web'
              ]
            ]

          })

        });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            JSON.stringify(data)
          );
        }


        document.getElementById('status').textContent =
          product + ' adicionado com sucesso.';


        // Limpar formulário

        document.getElementById('product').value = '';

        document.getElementById('quantity').value = '1';

        document.getElementById('category').value = '';


        // Atualizar automaticamente a lista

        await readShopping();


      } catch (error) {

        document.getElementById('status').textContent =
          'Erro ao adicionar produto.';

        document.getElementById('output').textContent =
          error.message;
      }
    }

  </script>

</body>
</html>
