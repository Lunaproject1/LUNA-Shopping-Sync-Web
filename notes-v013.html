<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;color:#18202a}header{background:#111827;color:#fff;padding:17px 16px;position:sticky;top:0;z-index:5}.top,main{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.small{font-size:12px;color:#667085}.top .small{color:#cbd5e1}.card,.toolbar,.view,.edit{background:#fff;border:1px solid #e1e5ea;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}main{padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}button,input,textarea{font:inherit;border:1px solid #d0d5dd;border-radius:10px;padding:10px;background:#fff}button{font-weight:650;cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}.danger{color:#b42318}.hidden{display:none!important}input.title{width:100%;font-size:20px;font-weight:750;border:0;padding:5px 0;outline:none}textarea{width:100%;min-height:230px;border:0;padding:10px 0;resize:vertical;outline:none;line-height:1.5}.card h3,.view h2{margin:0 0 8px}.body{white-space:pre-wrap;line-height:1.5}.meta{font-size:11px;color:#98a2b3;margin-top:10px}.fold{border-top:1px solid #eaecf0;margin-top:14px;padding-top:10px}.foldBtn{border:0;padding:4px 0;background:none;width:100%;text-align:left}.check{display:flex;gap:8px;align-items:center;padding:7px 0}.check input{flex:0}.history{margin-top:7px}.event{border-left:2px solid #d0d5dd;padding:4px 0 4px 10px;margin:8px 0;font-size:13px}.empty{text-align:center;color:#667085;padding:35px}.footer{text-align:center;color:#98a2b3;font-size:11px;padding:18px}.brandWrap{display:flex;align-items:center;gap:10px}.brandOfficial{width:52px;height:52px;flex:0 0 52px;overflow:hidden}.brandOfficial img{display:block;width:100%;height:100%;object-fit:cover;border-radius:13px}</style></head><body>

<script>
const CLIENT_ID='447933051526-jdcl86ljqb6ehsiupr3aomjhia0fbqr2.apps.googleusercontent.com',SID='1XqsIs_fp_nAOHNP7H5FVWO6usFInSCFXnCDSt6ov9eA',K='luna.notes.v01',KC='luna.notes.checks.v01',KH='luna.notes.history.v01';
let notes=L(K),checks=L(KC),events=L(KH),current=null,editing=null,token=null,tc=null,syncing=false;const $=x=>document.getElementById(x),now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
function L(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){localStorage.setItem(K,JSON.stringify(notes));localStorage.setItem(KC,JSON.stringify(checks));localStorage.setItem(KH,JSON.stringify(events));render()}
function addHistory(nid,type,desc,metadata=''){let t=now();events.push({id:uid(),noteId:nid,type,description:desc,value:'',currency:'',balanceAfter:'',eventDate:t,origin:'LUNA Notes App',transactionId:'',createdAt:t,updatedAt:t,deleted:false,dirty:true,version:'0.1.3',metadata})}
function diffText(oldText,newText){oldText=String(oldText||'');newText=String(newText||'');if(oldText===newText)return{added:'',removed:''};let a=oldText.split(/\n/),b=newText.split(/\n/),m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,removed=[],added=[];while(i<m&&j<n){if(a[i]===b[j]){i++;j++}else if(dp[i+1][j]>=dp[i][j+1])removed.push(a[i++]);else added.push(b[j++])}while(i<m)removed.push(a[i++]);while(j<n)added.push(b[j++]);return{added:added.filter(x=>x.trim()).join('\n'),removed:removed.filter(x=>x.trim()).join('\n')}}
function editSummary(oldTitle,newTitle,oldContent,newContent){let d=diffText(oldContent,newContent),parts=[];if(oldTitle!==newTitle)parts.push('Título: '+oldTitle+' → '+newTitle);if(d.added)parts.push('Adicionado:\n'+d.added);if(d.removed)parts.push('Removido:\n'+d.removed);return parts.join('\n\n')||'Nota atualizada'}
function newNote(){editing='new';current=null;$('title').value='';$('content').value='';$('view').classList.add('hidden');$('edit').classList.remove('hidden');$('title').focus()}
function editNote(){let n=notes.find(x=>x.id===current);if(!n)return;editing=n.id;$('title').value=n.title;$('content').value=n.content;$('view').classList.add('hidden');$('edit').classList.remove('hidden')}
function save(){let title=$('title').value.trim(),content=$('content').value;if(!title)return alert('Escreve um título para a nota.');let t=now();if(editing==='new'){let n={id:uid(),title,category:'Pessoal',state:'Ativa',content,type:'Nota',initial:'',balance:'',reference:'',currency:'',createdAt:t,updatedAt:t,updatedBy:'LUNA Notes App',deleted:false,dirty:true};notes.push(n);addHistory(n.id,'Criação','Nota criada');current=n.id}else{let n=notes.find(x=>x.id===editing);if(!n)return;let oldTitle=n.title,oldContent=n.content,changed=oldTitle!==title||oldContent!==content;n.title=title;n.content=content;n.updatedAt=t;n.updatedBy='LUNA Notes App';n.dirty=true;if(changed)addHistory(n.id,'Edição',editSummary(oldTitle,title,oldContent,content),JSON.stringify({oldTitle,oldContent,newTitle:title,newContent:content})) ;current=n.id}editing=null;$('edit').classList.add('hidden');persist();openNote(current);autoSync()}
function openNote(nid){let n=notes.find(x=>x.id===nid&&!x.deleted);if(!n)return;current=nid;$('edit').classList.add('hidden');$('view').classList.remove('hidden');$('vtitle').textContent=n.title;$('vbody').textContent=n.content;$('vmeta').textContent='Atualizada '+new Date(n.updatedAt).toLocaleString('pt-PT');$('checkArea').classList.add('hidden');$('history').classList.add('hidden');renderChecks();renderHistory();scrollTo({top:0,behavior:'smooth'})}
function del(){let n=notes.find(x=>x.id===current);if(!n||!confirm('Eliminar esta nota?'))return;n.deleted=true;n.updatedAt=now();n.dirty=true;addHistory(n.id,'Eliminação','Nota eliminada');current=null;$('view').classList.add('hidden');persist();autoSync()}
function addCheck(){let v=$('newCheck').value.trim();if(!v||!current)return;let t=now();checks.push({id:uid(),noteId:current,text:v,state:'pending',order:checks.filter(x=>x.noteId===current&&!x.deleted).length+1,createdAt:t,completedAt:'',updatedAt:t,updatedBy:'LUNA Notes App',deleted:false,dirty:true,version:'0.1.3',observations:''});$('newCheck').value='';addHistory(current,'Checklist','Item adicionado à checklist');persist();renderChecks();renderHistory();autoSync()}
function toggle(cid,on){let c=checks.find(x=>x.id===cid);if(!c)return;c.state=on?'completed':'pending';c.completedAt=on?now():'';c.updatedAt=now();c.dirty=true;addHistory(c.noteId,'Checklist',on?'Item concluído':'Item reaberto');persist();renderChecks();renderHistory();autoSync()}
function renderChecks(){let a=checks.filter(c=>c.noteId===current&&!c.deleted).sort((a,b)=>a.order-b.order),r=$('checks');r.innerHTML='';a.forEach(c=>{let d=document.createElement('div');d.className='check';d.innerHTML='<input type="checkbox" '+(c.state==='completed'?'checked':'')+'><span>'+esc(c.text)+'</span>';d.querySelector('input').onchange=e=>toggle(c.id,e.target.checked);r.appendChild(d)});$('checkFold').textContent='▸ Checklist'+(a.length?' ('+a.length+')':'')}
function renderHistory(){let a=events.filter(e=>e.noteId===current&&!e.deleted).sort((a,b)=>b.eventDate.localeCompare(a.eventDate)),r=$('history');r.innerHTML='';$('histCount').textContent=a.length?'('+a.length+')':'';a.forEach(e=>{let d=document.createElement('div');d.className='event';d.innerHTML='<b>'+esc(e.type)+'</b> · '+esc(new Date(e.eventDate).toLocaleString('pt-PT'))+'<br><span style="white-space:pre-wrap">'+esc(e.description)+'</span>';r.appendChild(d)})}
function render(){let r=$('list'),a=notes.filter(n=>!n.deleted&&n.state!=='Arquivada').sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));r.innerHTML='';$('empty').classList.toggle('hidden',a.length>0);a.forEach(n=>{let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+esc(n.title||'Sem título')+'</h3><div class="body">'+esc(n.content).slice(0,220)+'</div><div class="meta">Atualizada '+esc(new Date(n.updatedAt).toLocaleString('pt-PT'))+'</div>';d.onclick=()=>openNote(n.id);r.appendChild(d)})}
$('checkFold').onclick=()=>{$('checkArea').classList.toggle('hidden');$('checkFold').textContent=($('checkArea').classList.contains('hidden')?'▸':'▾')+' Checklist'+(checks.filter(c=>c.noteId===current&&!c.deleted).length?' ('+checks.filter(c=>c.noteId===current&&!c.deleted).length+')':'')};$('histFold').onclick=()=>{$('history').classList.toggle('hidden');$('histFold').childNodes[0].nodeValue=$('history').classList.contains('hidden')?'▸ Histórico ':'▾ Histórico '};
function net(){$('net').textContent=navigator.onLine?'● Online · local':'● Offline · local';if(!navigator.onLine)$('status').textContent='Offline · alterações guardadas localmente'}
function initGoogle(){if(!window.google?.accounts?.oauth2)return false;tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets',callback:r=>{if(r.error)return $('status').textContent='Google: autorização falhou';token=r.access_token;$('status').textContent='Google ligado';syncAll()}});return true}function connect(){if(!navigator.onLine)return $('status').textContent='Sem Internet · a app continua local';if(!tc&&!initGoogle())return $('status').textContent='Google ainda a carregar';tc.requestAccessToken({prompt:'select_account'})}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(r.status===401){token=null;throw Error('AUTH')}if(!r.ok)throw Error(await r.text());return r.json()}
const cfg=[{name:'Notes',range:'Notes!A:R',get:()=>notes,set:x=>notes=x,from:r=>({id:r[0],title:r[1]||'',category:r[2]||'Pessoal',state:r[3]||'Ativa',content:r[4]||'',type:r[5]||'Nota',initial:r[6]||'',balance:r[7]||'',reference:r[8]||'',currency:r[9]||'',createdAt:r[10]||now(),updatedAt:r[11]||r[10]||now(),updatedBy:r[12]||'',deleted:String(r[13]).toLowerCase()==='true',dirty:false}),row:x=>[x.id,x.title,x.category,x.state,x.content,x.type,x.initial,x.balance,x.reference,x.currency,x.createdAt,x.updatedAt,x.updatedBy,x.deleted?'true':'false','','','','0.1.3']},{name:'Notes_Checklist',range:'Notes_Checklist!A:L',get:()=>checks,set:x=>checks=x,from:r=>({id:r[0],noteId:r[1],text:r[2]||'',state:r[3]||'pending',order:+r[4]||0,createdAt:r[5]||now(),completedAt:r[6]||'',updatedAt:r[7]||r[5]||now(),updatedBy:r[8]||'',deleted:String(r[9]).toLowerCase()==='true',dirty:false,version:r[10]||'',observations:r[11]||''}),row:x=>[x.id,x.noteId,x.text,x.state,x.order,x.createdAt,x.completedAt,x.updatedAt,x.updatedBy,x.deleted?'true':'false',x.version,x.observations]},{name:'Notes_History',range:'Notes_History!A:O',get:()=>events,set:x=>events=x,from:r=>({id:r[0],noteId:r[1],type:r[2]||'',description:r[3]||'',value:r[4]||'',currency:r[5]||'',balanceAfter:r[6]||'',eventDate:r[7]||now(),origin:r[8]||'',transactionId:r[9]||'',createdAt:r[10]||now(),updatedAt:r[11]||r[10]||now(),deleted:String(r[12]).toLowerCase()==='true',dirty:false,version:r[13]||'',metadata:r[14]||''}),row:x=>[x.id,x.noteId,x.type,x.description,x.value,x.currency,x.balanceAfter,x.eventDate,x.origin,x.transactionId,x.createdAt,x.updatedAt,x.deleted?'true':'false',x.version,x.metadata]}];
async function syncTable(c){let base='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/',data=await api(base+encodeURIComponent(c.range)),rows=(data.values||[]).slice(1),remoteRows=new Map();rows.forEach((r,i)=>{if(r[0])remoteRows.set(r[0],{obj:c.from(r),row:i+2})});let local=c.get();for(let l of local.filter(x=>x.dirty)){let rr=remoteRows.get(l.id),lt=Date.parse(l.updatedAt)||0,rt=Date.parse(rr?.obj?.updatedAt)||0;if(rr&&lt<=rt)continue;let vals=[c.row(l)];if(rr){let end=c.name==='Notes'?'R':c.name==='Notes_Checklist'?'L':'O',range=c.name+'!A'+rr.row+':'+end+rr.row;await api(base+encodeURIComponent(range)+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({range,majorDimension:'ROWS',values:vals})})}else{let range=c.name+'!A:'+ (c.name==='Notes'?'R':c.name==='Notes_Checklist'?'L':'O');await api(base+encodeURIComponent(range)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({majorDimension:'ROWS',values:vals})})}}let verify=await api(base+encodeURIComponent(c.range)),fresh=(verify.values||[]).slice(1).filter(r=>r[0]).map(c.from),freshMap=new Map(fresh.map(x=>[x.id,x]));for(let l of local){let r=freshMap.get(l.id);if(!r){if(l.dirty)fresh.push(l);continue}let lt=Date.parse(l.updatedAt)||0,rt=Date.parse(r.updatedAt)||0;if(l.dirty&&lt>rt){let idx=fresh.findIndex(x=>x.id===l.id);fresh[idx]=l}else l.dirty=false}fresh.forEach(x=>x.dirty=false);c.set(fresh)}
async function syncAll(){if(syncing||!token||!navigator.onLine)return;syncing=true;$('status').textContent='A sincronizar…';try{for(let c of cfg)await syncTable(c);persist();$('status').textContent='Sincronizado · '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}catch(e){$('status').textContent=e.message==='AUTH'?'Sessão Google expirou · liga novamente':'Erro de sincronização'}finally{syncing=false}}function autoSync(){if(token&&navigator.onLine)setTimeout(syncAll,250)}
$('new').onclick=newNote;$('save').onclick=save;$('cancel').onclick=()=>{$('edit').classList.add('hidden');editing=null};$('editBtn').onclick=editNote;$('close').onclick=()=>{$('view').classList.add('hidden');current=null};$('del').onclick=del;$('addCheck').onclick=addCheck;$('google').onclick=connect;$('sync').onclick=()=>token?syncAll():connect;addEventListener('online',()=>{net();autoSync()});addEventListener('offline',net);net();render();setTimeout(initGoogle,900);
