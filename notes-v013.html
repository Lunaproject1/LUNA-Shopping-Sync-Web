async function syncTable(c){let base='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/',data=await api(base+encodeURIComponent(c.range)),rows=(data.values||[]).slice(1),remoteRows=new Map();rows.forEach((r,i)=>{if(r[0])remoteRows.set(r[0],{obj:c.from(r),row:i+2})});let local=c.get();for(let l of local.filter(x=>x.dirty)){let rr=remoteRows.get(l.id),lt=Date.parse(l.updatedAt)||0,rt=Date.parse(rr?.obj?.updatedAt)||0;if(rr&&lt<=rt)continue;let vals=[c.row(l)];if(rr){let end=c.name==='Notes'?'R':c.name==='Notes_Checklist'?'L':'O',range=c.name+'!A'+rr.row+':'+end+rr.row;await api(base+encodeURIComponent(range)+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({range,majorDimension:'ROWS',values:vals})})}else{let range=c.name+'!A:'+ (c.name==='Notes'?'R':c.name==='Notes_Checklist'?'L':'O');await api(base+encodeURIComponent(range)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({majorDimension:'ROWS',values:vals})})}}let verify=await api(base+encodeURIComponent(c.range)),fresh=(verify.values||[]).slice(1).filter(r=>r[0]).map(c.from),freshMap=new Map(fresh.map(x=>[x.id,x]));for(let l of local){let r=freshMap.get(l.id);if(!r){if(l.dirty)fresh.push(l);continue}let lt=Date.parse(l.updatedAt)||0,rt=Date.parse(r.updatedAt)||0;if(l.dirty&&lt>rt){let idx=fresh.findIndex(x=>x.id===l.id);fresh[idx]=l}else l.dirty=false}fresh.forEach(x=>x.dirty=false);c.set(fresh)}
async function syncAll(){if(syncing||!token||!navigator.onLine)return;syncing=true;$('status').textContent='A sincronizar…';try{for(let c of cfg)await syncTable(c);persist();$('status').textContent='Sincronizado · '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}catch(e){$('status').textContent=e.message==='AUTH'?'Sessão Google expirou · liga novamente':'Erro de sincronização'}finally{syncing=false}}function autoSync(){if(token&&navigator.onLine)setTimeout(syncAll,250)}
let notesViewMode='notes',calendarCursor=new Date(),calendarSelected='';
function noteDay(n){return n.associatedDate||String(n.createdAt||'').slice(0,10)}
function localDateKey(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function setNotesView(mode){notesViewMode=mode;let cal=mode==='calendar';$('calendarView').classList.toggle('hidden',!cal);$('list').classList.toggle('hidden',cal);$('empty').classList.toggle('hidden',cal||notes.filter(n=>!n.deleted&&n.state!=='Arquivada').length>0);$('notesTab').classList.toggle('active',!cal);$('calendarTab').classList.toggle('active',cal);if(cal)renderCalendar();else render()}
function renderCalendar(){let y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),today=localDateKey(new Date());$('calTitle').textContent=calendarCursor.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});let r=$('calendarGrid');r.innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=localDateKey(d),dayNotes=notes.filter(n=>!n.deleted&&n.state!=='Arquivada'&&noteDay(n)===key),b=document.createElement('button');b.type='button';b.className='calDay'+(d.getMonth()!==m?' other':'')+(key===today?' today':'')+(key===calendarSelected?' selected':'');b.innerHTML='<span class="calDayNum">'+d.getDate()+'</span>'+(dayNotes.length?'<span class="calDots">'+dayNotes.slice(0,3).map(()=>'<i class="calDot"></i>').join('')+'</span><div class="calCount">'+dayNotes.length+' nota'+(dayNotes.length>1?'s':'')+'</div>':'');b.onclick=()=>{calendarSelected=key;renderCalendar()};r.appendChild(b)}renderCalendarDay()}
function renderCalendarDay(){let box=$('calendarDayNotes');if(!calendarSelected){box.innerHTML='<div class="calEmpty">Seleciona um dia para ver as notas.</div>';return}let a=notes.filter(n=>!n.deleted&&n.state!=='Arquivada'&&noteDay(n)===calendarSelected).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));let label=new Date(calendarSelected+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});box.innerHTML='<div class="calendarDayTitle">'+esc(label)+'</div>';if(!a.length){box.innerHTML+='<div class="calEmpty">Sem notas neste dia.</div>';return}a.forEach(n=>{let b=document.createElement('button');b.type='button';b.className='calNote';b.innerHTML='<strong>'+esc(n.title||'Sem título')+'</strong><span>'+(n.associatedDate?'data associada':'criada neste dia')+'</span>';b.onclick=()=>openNote(n.id);box.appendChild(b)})}
$('notesTab').onclick=()=>setNotesView('notes');$('calendarTab').onclick=()=>setNotesView('calendar');$('calPrev').onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);renderCalendar()};$('calNext').onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);renderCalendar()};
function togglePin(){let n=notes.find(x=>x.id===current&&!x.deleted);if(!n)return;n.pinned=!n.pinned;n.updatedAt=now();n.dirty=true;addHistory(n.id,'Organização',n.pinned?'Nota fixada':'Nota desafixada');persist();openNote(n.id);autoSync()}
$('pinBtn').onclick=togglePin;
$('new').onclick=newNote;$('save').onclick=save;$('cancel').onclick=()=>{$('edit').classList.add('hidden');editing=null};$('editBtn').onclick=editNote;$('close').onclick=()=>{$('view').classList.add('hidden');current=null};$('del').onclick=del;$('addCheck').onclick=addCheck;addEventListener('online',()=>{net();autoSync()});addEventListener('offline',net);function updateNotesClock(){let d=new Date(),top=$('topClock');if(top)top.textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}updateNotesClock();setInterval(updateNotesClock,30000);net();render();setTimeout(initGoogle,900);
