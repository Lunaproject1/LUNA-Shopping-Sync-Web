document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));render()});async function refreshRate(){if(!navigator.onLine)return;try{let r=await fetch('https://api.frankfurter.dev/v2/rate/EUR/UAH');if(!r.ok)return;let j=await r.json(),v=Number(j.rate);if(v>0){localStorage.setItem('luna.finance.eur_uah.v01',String(v));render()}}catch{}}
function net(){$('net').textContent=navigator.onLine?'● Online · local':'● Offline · local';if(!navigator.onLine)$('status').textContent='Offline · alterações guardadas localmente'}function initGoogle(){if(!window.google?.accounts?.oauth2)return false;tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets',callback:r=>{if(r.error)return $('status').textContent='Google: autorização falhou';token=r.access_token;$('status').textContent='Google ligado';syncAll()}});return true}function connect(){if(!navigator.onLine)return $('status').textContent='Sem Internet · a app continua local';if(!tc&&!initGoogle())return $('status').textContent='Google ainda a carregar';tc.requestAccessToken({prompt:'select_account'})}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(r.status===401){token=null;throw Error('AUTH')}if(!r.ok)throw Error(await r.text());return r.json()}

async function syncTable(c){let base='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/',data=await api(base+encodeURIComponent(c.range)),rows=(data.values||[]).slice(1),remote=new Map();rows.forEach((r,i)=>{if(r[0])remote.set(r[0],{obj:c.from(r),row:i+2})});let local=c.get();for(let l of local.filter(x=>x.dirty)){let rr=remote.get(l.id),lt=Date.parse(l.updatedAt)||0,rt=Date.parse(rr?.obj?.updatedAt)||0;if(rr&&lt<=rt)continue;let vals=[c.row(l)];if(rr){let range=c.name+'!A'+rr.row+':'+c.end+rr.row;await api(base+encodeURIComponent(range)+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({range,majorDimension:'ROWS',values:vals})})}else{let range=c.name+'!A:'+c.end;await api(base+encodeURIComponent(range)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({majorDimension:'ROWS',values:vals})})}}let verify=await api(base+encodeURIComponent(c.range)),fresh=(verify.values||[]).slice(1).filter(r=>r[0]).map(c.from),fm=new Map(fresh.map(x=>[x.id,x]));for(let l of local){let r=fm.get(l.id);if(!r&&l.dirty)fresh.push(l);else if(r){let lt=Date.parse(l.updatedAt)||0,rt=Date.parse(r.updatedAt)||0;if(l.dirty&&lt>rt){let i=fresh.findIndex(x=>x.id===l.id);fresh[i]=l}else l.dirty=false}}fresh.forEach(x=>x.dirty=false);c.set(fresh)}
