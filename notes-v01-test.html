<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>LUNA Notes v0.1 TEST</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#18202a}header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}.top{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;opacity:.75}main{max-width:850px;margin:auto;padding:14px}.bar,.card,.editor{background:white;border:1px solid #dfe4ea;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}input,select,textarea,button{font:inherit;border:1px solid #cfd6df;border-radius:10px;padding:10px;background:white}textarea{width:100%;min-height:110px;resize:vertical}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:white;border-color:#111827}.danger{color:#b42318}.muted{color:#667085;font-size:12px}.status{font-size:12px;margin-top:8px}.note{display:grid;grid-template-columns:1fr auto;gap:8px}.note h3{margin:0 0 4px;font-size:17px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{font-size:11px;background:#eef2f6;border-radius:999px;padding:4px 8px}.content{white-space:pre-wrap;font-size:14px}.money{font-weight:750;margin-top:8px}.hidden{display:none!important}.sectionTitle{font-size:13px;font-weight:800;margin:14px 0 7px}.check{display:flex;gap:8px;align-items:center;padding:6px 0}.check input{flex:0}.event{border-left:2px solid #d0d5dd;padding:4px 0 4px 10px;margin:6px 0;font-size:13px}.footer{text-align:center;color:#98a2b3;font-size:11px;padding:18px}#empty{text-align:center;padding:30px;color:#667085}
</style></head><body>
<header><div class="top"><div><div class="brand">🌙 LUNA Notes</div><div class="sub">v0.1 TEST · offline-first</div></div><div id="net" class="sub">● Local</div></div></header>
<main>
<div class="bar"><div class="row"><button id="newBtn" class="primary">＋ Nova nota</button><button id="googleBtn">Ligar Google</button><button id="syncBtn">Sincronizar</button></div><div id="syncStatus" class="status muted">Dados guardados localmente.</div></div>
<div id="editor" class="editor hidden">
<div class="row"><input id="title" placeholder="Título"><select id="category"><option>Pessoal</option><option>Finanças</option><option>Trabalho</option><option>Carro</option><option>Tugi</option><option>Treino</option><option>Outros</option></select><select id="state"><option>Ativa</option><option>Concluída</option><option>Arquivada</option></select></div>
<div style="height:8px"></div><textarea id="content" placeholder="Observações / conteúdo da nota"></textarea>
<div class="sectionTitle">Valores opcionais</div><div class="row"><input id="initial" inputmode="decimal" placeholder="Valor inicial"><input id="balance" inputmode="decimal" placeholder="Saldo atual"><input id="reference" inputmode="decimal" placeholder="Valor referência"><select id="currency"><option>EUR</option><option>UAH</option><option>USD</option></select></div>
<div class="sectionTitle">Checklist</div><div id="checks"></div><div class="row"><input id="newCheck" placeholder="Novo item"><button id="addCheck">Adicionar</button></div>
<div class="sectionTitle">Histórico / atualização</div><div id="events"></div><div class="row"><select id="eventType"><option>Atualização</option><option>Pagamento</option><option>Observação</option></select><input id="eventDesc" placeholder="Descrição"><input id="eventValue" inputmode="decimal" placeholder="Valor (opcional)"><button id="addEvent">Registar</button></div>
<div style="height:12px"></div><div class="row"><button id="saveBtn" class="primary">Guardar nota</button><button id="closeBtn">Fechar</button><button id="deleteBtn" class="danger">Arquivar/Eliminar</button></div></div>
<div id="list"></div><div id="empty">Ainda não existem notas.</div>
<div class="footer">LUNA Notes v0.1 TEST · Projeto Luna</div>
</main>
<script>
const CLIENT_ID='447933051526-jdcl86ljqb6ehsiupr3aomjhia0fbqr2.apps.googleusercontent.com',SID='1XqsIs_fp_nAOHNP7H5FVWO6usFInSCFXnCDSt6ov9eA';
const K='luna.notes.v01',KC='luna.notes.checks.v01',KH='luna.notes.history.v01';let notes=load(K,[]),checks=load(KC,[]),events=load(KH,[]),editing=null,token=null,tc=null,syncing=false;
const $=x=>document.getElementById(x),now=()=>new Date().toISOString(),id=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}} function persist(){localStorage.setItem(K,JSON.stringify(notes));localStorage.setItem(KC,JSON.stringify(checks));localStorage.setItem(KH,JSON.stringify(events));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function num(v){let n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function newNote(){editing=id();let t=now();notes.push({id:editing,title:'',category:'Pessoal',state:'Ativa',content:'',type:'Nota',initial:'',balance:'',reference:'',currency:'EUR',createdAt:t,updatedAt:t,updatedBy:'LUNA Notes App',deleted:false,dirty:true});persist();open(editing)}
function open(nid){let n=notes.find(x=>x.id===nid);if(!n)return;editing=nid;$('title').value=n.title;$('category').value=n.category;$('state').value=n.state;$('content').value=n.content;$('initial').value=n.initial;$('balance').value=n.balance;$('reference').value=n.reference;$('currency').value=n.currency;$('editor').classList.remove('hidden');renderChecks();renderEvents();scrollTo({top:0,behavior:'smooth'})}
function saveNote(){let n=notes.find(x=>x.id===editing);if(!n)return;let title=$('title').value.trim();if(!title)return alert('A nota precisa de um título.');Object.assign(n,{title,category:$('category').value,state:$('state').value,content:$('content').value,initial:$('initial').value.trim(),balance:$('balance').value.trim(),reference:$('reference').value.trim(),currency:$('currency').value,updatedAt:now(),updatedBy:'LUNA Notes App',dirty:true});persist();$('editor').classList.add('hidden');editing=null;autoSync()}
function deleteNote(){let n=notes.find(x=>x.id===editing);if(!n||!confirm('Arquivar/eliminar esta nota?'))return;n.deleted=true;n.updatedAt=now();n.dirty=true;persist();$('editor').classList.add('hidden');editing=null;autoSync()}
function addCheck(){let v=$('newCheck').value.trim();if(!v||!editing)return;let t=now();checks.push({id:id(),noteId:editing,text:v,state:'pending',order:checks.filter(x=>x.noteId===editing).length+1,createdAt:t,completedAt:'',updatedAt:t,updatedBy:'LUNA Notes App',deleted:false,dirty:true,version:'0.1',observations:''});$('newCheck').value='';persist();renderChecks();autoSync()}
function toggleCheck(cid,on){let c=checks.find(x=>x.id===cid);if(!c)return;c.state=on?'completed':'pending';c.completedAt=on?now():'';c.updatedAt=now();c.dirty=true;persist();renderChecks();autoSync()}
function addEvent(){if(!editing)return;let desc=$('eventDesc').value.trim(),typ=$('eventType').value,val=$('eventValue').value.trim();if(!desc&&!val)return;let n=notes.find(x=>x.id===editing),t=now(),after=n?.balance||'';if(typ==='Pagamento'&&val&&n){let v=num(val),b=num(n.balance);if(v!==null&&b!==null){after=Math.max(0,b-v).toFixed(2);n.balance=after;$('balance').value=after;n.updatedAt=t;n.dirty=true}}events.push({id:id(),noteId:editing,type:typ,description:desc||typ,value:val,currency:n?.currency||'EUR',balanceAfter:after,eventDate:t,origin:'LUNA Notes App',transactionId:'',createdAt:t,updatedAt:t,deleted:false,dirty:true,version:'0.1',metadata:''});$('eventDesc').value='';$('eventValue').value='';persist();renderEvents();autoSync()}
function renderChecks(){let root=$('checks');root.innerHTML='';checks.filter(c=>c.noteId===editing&&!c.deleted).sort((a,b)=>a.order-b.order).forEach(c=>{let d=document.createElement('div');d.className='check';d.innerHTML='<input type="checkbox" '+(c.state==='completed'?'checked':'')+'><span>'+esc(c.text)+'</span>';d.querySelector('input').onchange=e=>toggleCheck(c.id,e.target.checked);root.appendChild(d)})}
function renderEvents(){let root=$('events');root.innerHTML='';events.filter(e=>e.noteId===editing&&!e.deleted).sort((a,b)=>b.eventDate.localeCompare(a.eventDate)).forEach(e=>{let d=document.createElement('div');d.className='event';d.innerHTML='<b>'+esc(e.type)+'</b> · '+esc(new Date(e.eventDate).toLocaleString('pt-PT'))+'<br>'+esc(e.description)+(e.value?' · '+esc(e.value)+' '+esc(e.currency):'')+(e.balanceAfter!==''?'<br><span class="muted">Saldo após: '+esc(e.balanceAfter)+' '+esc(e.currency)+'</span>':'');root.appendChild(d)})}
function render(){let root=$('list'),arr=notes.filter(n=>!n.deleted&&n.state!=='Arquivada').sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));root.innerHTML='';$('empty').classList.toggle('hidden',arr.length>0);arr.forEach(n=>{let d=document.createElement('div');d.className='card note';let money=n.balance!==''?'<div class="money">Saldo: '+esc(n.balance)+' '+esc(n.currency)+'</div>':'';d.innerHTML='<div><h3>'+esc(n.title||'Sem título')+'</h3><div class="chips"><span class="chip">'+esc(n.category)+'</span><span class="chip">'+esc(n.state)+'</span></div><div class="content">'+esc(n.content).slice(0,240)+'</div>'+money+'<div class="muted">Atualizada '+esc(new Date(n.updatedAt).toLocaleString('pt-PT'))+'</div></div><button>Abrir</button>';d.querySelector('button').onclick=()=>open(n.id);root.appendChild(d)})}
function net(){$('net').textContent=navigator.onLine?'● Online · local':'● Offline · local';if(!navigator.onLine)$('syncStatus').textContent='Offline · alterações guardadas localmente'}
function initGoogle(){if(!window.google?.accounts?.oauth2)return false;tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets',callback:r=>{if(r.error)return $('syncStatus').textContent='Google: autorização falhou';token=r.access_token;$('syncStatus').textContent='Google ligado';syncAll()}});return true}
function connect(){if(!navigator.onLine)return $('syncStatus').textContent='Sem Internet · a app continua local';if(!tc&&!initGoogle())return $('syncStatus').textContent='Google ainda a carregar';tc.requestAccessToken({prompt:'select_account'})}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){token=null;throw Error('AUTH')}if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
const sheets=[
 {name:'Notes',range:'Notes!A:R',local:()=>notes,from:r=>({id:r[0],title:r[1]||'',category:r[2]||'Pessoal',state:r[3]||'Ativa',content:r[4]||'',type:r[5]||'Nota',initial:r[6]||'',balance:r[7]||'',reference:r[8]||'',currency:r[9]||'EUR',createdAt:r[10]||now(),updatedAt:r[11]||r[10]||now(),updatedBy:r[12]||'',deleted:String(r[13]).toLowerCase()==='true',dirty:false}),row:x=>[x.id,x.title,x.category,x.state,x.content,x.type||'Nota',x.initial,x.balance,x.reference,x.currency,x.createdAt,x.updatedAt,x.updatedBy||'LUNA Notes App',x.deleted?'true':'false','','','','0.1']},
 {name:'Notes_Checklist',range:'Notes_Checklist!A:L',local:()=>checks,from:r=>({id:r[0],noteId:r[1],text:r[2]||'',state:r[3]||'pending',order:Number(r[4]||0),createdAt:r[5]||now(),completedAt:r[6]||'',updatedAt:r[7]||r[5]||now(),updatedBy:r[8]||'',deleted:String(r[9]).toLowerCase()==='true',dirty:false,version:r[10]||'0.1',observations:r[11]||''}),row:x=>[x.id,x.noteId,x.text,x.state,x.order,x.createdAt,x.completedAt,x.updatedAt,x.updatedBy||'LUNA Notes App',x.deleted?'true':'false',x.version||'0.1',x.observations||'']},
 {name:'Notes_History',range:'Notes_History!A:O',local:()=>events,from:r=>({id:r[0],noteId:r[1],type:r[2]||'Atualização',description:r[3]||'',value:r[4]||'',currency:r[5]||'EUR',balanceAfter:r[6]||'',eventDate:r[7]||now(),origin:r[8]||'',transactionId:r[9]||'',createdAt:r[10]||now(),updatedAt:r[11]||r[10]||now(),deleted:String(r[12]).toLowerCase()==='true',dirty:false,version:r[13]||'0.1',metadata:r[14]||''}),row:x=>[x.id,x.noteId,x.type,x.description,x.value,x.currency,x.balanceAfter,x.eventDate,x.origin||'LUNA Notes App',x.transactionId||'',x.createdAt,x.updatedAt,x.deleted?'true':'false',x.version||'0.1',x.metadata||'']}
];
async function syncTable(cfg){let u='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/'+encodeURIComponent(cfg.range),data=await api(u),remote=(data.values||[]).slice(1).filter(r=>r[0]).map(cfg.from),local=cfg.local(),map=new Map(remote.map(x=>[x.id,x]));for(let l of local){let r=map.get(l.id);let lt=Date.parse(l.updatedAt||0)||0,rt=Date.parse(r?.updatedAt||0)||0;if(!r||(l.dirty&&lt>rt))map.set(l.id,l)}let merged=[...map.values()];let dirty=local.filter(x=>x.dirty);if(dirty.length){let clear='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/'+encodeURIComponent(cfg.name+'!A2:Z1000')+':clear';await api(clear,{method:'POST',body:'{}'});if(merged.length){let wr='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/'+encodeURIComponent(cfg.name+'!A2')+'?valueInputOption=RAW';await api(wr,{method:'PUT',body:JSON.stringify({range:cfg.name+'!A2',majorDimension:'ROWS',values:merged.map(cfg.row)})})}}merged.forEach(x=>x.dirty=false);if(cfg.name==='Notes')notes=merged;if(cfg.name==='Notes_Checklist')checks=merged;if(cfg.name==='Notes_History')events=merged}
async function syncAll(){if(syncing||!token||!navigator.onLine)return;syncing=true;$('syncStatus').textContent='A sincronizar…';try{for(let s of sheets)await syncTable(s);persist();$('syncStatus').textContent='Sincronizado · '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}catch(e){$('syncStatus').textContent=e.message==='AUTH'?'Sessão Google expirou · liga novamente':'Erro de sincronização'}finally{syncing=false}}
function autoSync(){if(token&&navigator.onLine)setTimeout(syncAll,300)}
$('newBtn').onclick=newNote;$('saveBtn').onclick=saveNote;$('closeBtn').onclick=()=>{$('editor').classList.add('hidden');editing=null};$('deleteBtn').onclick=deleteNote;$('addCheck').onclick=addCheck;$('addEvent').onclick=addEvent;$('googleBtn').onclick=connect;$('syncBtn').onclick=()=>token?syncAll():connect;addEventListener('online',()=>{net();autoSync()});addEventListener('offline',net);net();render();setTimeout(initGoogle,1000);
</script></body></html>
